<!doctype html>
<html lang=id>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>JANCUKS CSV TOOL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel=stylesheet>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Orbitron,Arial;background:#000;color:#fff;padding:20px}body::before{content:"";position:fixed;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,#f0f 0,transparent 25%),radial-gradient(circle at 80% 70%,#0ff 0,transparent 25%);animation:bg 15s linear infinite;opacity:.25;z-index:-1}@keyframes bg{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.title{font-size:60px;font-weight:900;text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#f0f,#0ff,#fc0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 2s infinite alternate}@keyframes glow{from{text-shadow:0 0 10px #f0f}to{text-shadow:0 0 30px #0ff}}.container{background:#0b0b0b;padding:20px;border-radius:15px;box-shadow:0 0 10px #f0f,0 0 20px #0ff}input[type=file],textarea{width:100%;background:#000;color:#0ff;border:1px solid #0ff;padding:10px;margin-top:10px;border-radius:8px}button{padding:10px 20px;margin-top:10px;background:linear-gradient(45deg,#f0f,#0ff);border:0;color:#fff;border-radius:8px;cursor:pointer;font-weight:700}button:hover{transform:scale(1.05);box-shadow:0 0 15px #0ff}.copy{background:linear-gradient(45deg,#0f9,#0ff)}table{width:100%;margin-top:10px;border-collapse:collapse}td,th{border:1px solid #333;padding:5px;font-size:12px}.preview{max-height:250px;overflow:auto}.result{margin-top:10px;background:#000;padding:10px;border:1px solid #0ff}</style>
</head>
<body>
<div class=title>
JANCUKS
</div>
<div class=container>
<h3>Cek Deposit CSV</h3>
<h4>Upload CSV</h4>
<input type=file id=csv>
<button onclick=loadCSV()>Proses CSV</button>
<h4>Input Manual CSV</h4>
<textarea id=manualCSV rows=8></textarea>
<button onclick=loadManual()>Proses Manual</button>
<div class=preview>
<table id=preview></table>
</div>
<h4>Paste User ID</h4>
<textarea id=users rows=6></textarea>
<button onclick=filter()>Filter User</button>
<div id=result class=result></div>
<button class=copy onclick=copy()>Copy Hasil</button>
<textarea id=output rows=10></textarea>
</div>
<script>let data=[];function loadCSV(){const e=document.getElementById("csv").files[0];if(!e)return void alert("Upload CSV dulu");const t=new FileReader;t.onload=e=>{processData(e.target.result)},t.readAsText(e)}function loadManual(){let e=document.getElementById("manualCSV").value;e?processData(e):alert("Paste data dulu")}function processData(e){const t=e.split(/\r?\n/),l=document.getElementById("preview");l.innerHTML="",data=[],t.forEach(((e,t)=>{if(!e.trim())return;let a;a=e.includes("\t")?e.split("\t"):e.includes(";")?e.split(";"):e.split(/\s{2,}/);let n=document.createElement("tr");a.forEach((e=>{let l=document.createElement(t?"td":"th");l.innerText=e.replace(/"/g,"").trim(),n.appendChild(l)})),l.appendChild(n),a.length>=6?data.push({date:a[1],type:a[2],user:a[3],coin:a[5]}):a.length>=5&&data.push({date:a[0],type:a[1],user:a[2],coin:a[4]})}))}function filter(){let e=document.getElementById("users").value.toLowerCase().split("\n").map((e=>e.trim())).filter((e=>""!=e)),t={};e.forEach((e=>{t[e]={date:getToday(),total:0,list:[]}})),data.forEach((l=>{if(l.type.toLowerCase().includes("deposit")&&e.includes(l.user.toLowerCase())){let e=l.user.toLowerCase(),a=l.date.split(" ")[0];if(a.includes("-")){let e=a.split("-");a=`${e[2]}-${e[1]}-${e[0]}`}t[e].date=a;let n=parseInt(l.coin.replace(/,/g,""));t[e].list.push(Number(n).toLocaleString()),t[e].total+=n}}));let l="";for(let a of e){let e=t[a];0==e.list.length?l+=`${e.date} | ${a} | 0 | Total : 0\n`:l+=`${e.date} | ${a} | ${e.list.join(" | ")} | Total : ${e.total.toLocaleString()}\n`}document.getElementById("output").value=l,document.getElementById("result").innerHTML=l.replace(/\n/g,"<br>")}function getToday(){let e=new Date;return`${("0"+e.getDate()).slice(-2)}-${("0"+(e.getMonth()+1)).slice(-2)}-${e.getFullYear()}`}function copy(){document.getElementById("output").select(),document.execCommand("copy"),alert("Berhasil di copy")}</script>
</body>
</html>
