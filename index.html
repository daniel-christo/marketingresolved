<!doctype html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>JANCUKS CSV TOOL</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel=stylesheet><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Orbitron,Arial;background:#000;color:#fff;padding:20px}body::before{content:"";position:fixed;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,#f0f 0,transparent 25%),radial-gradient(circle at 80% 70%,#0ff 0,transparent 25%);animation:bg 15s linear infinite;opacity:.25;z-index:-1}@keyframes bg{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.title{font-size:60px;font-weight:900;text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#f0f,#0ff,#fc0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.container{background:#0b0b0b;padding:20px;border-radius:15px;box-shadow:0 0 10px #f0f,0 0 20px #0ff}.menu{display:flex;gap:10px;margin-bottom:15px}.menu button{flex:1}input[type=file],textarea{width:100%;background:#000;color:#0ff;border:1px solid #0ff;padding:10px;margin-top:10px;border-radius:8px}button{padding:10px 20px;margin-top:10px;background:linear-gradient(45deg,#f0f,#0ff);border:0;color:#fff;border-radius:8px;cursor:pointer;font-weight:700}button:hover{transform:scale(1.05);box-shadow:0 0 15px #0ff}.copy{background:linear-gradient(45deg,#0f9,#0ff)}table{width:100%;margin-top:10px;border-collapse:collapse}td,th{border:1px solid #333;padding:5px;font-size:12px}.preview{max-height:250px;overflow:auto}.result{margin-top:10px;background:#000;padding:10px;border:1px solid #0ff}.tab{margin-top:10px}</style></head><body><div class=title>JANCUKS</div><div class=container><div class=menu><button onclick='showTab("upload")'>Upload CSV</button><button onclick='showTab("manual")'>Manual Input</button></div><div id=upload class=tab><h3>Upload CSV</h3><input type=file id=csv><button onclick=loadCSV()>Proses CSV</button></div><div id=manual class=tab style=display:none><h3>Manual CSV</h3><textarea id=manualCSV rows=8></textarea><button onclick=loadManual()>Proses Manual</button></div><div class=preview><table id=preview></table></div><h4>Paste User ID</h4><textarea id=users rows=6></textarea><button onclick=filter()>Filter User</button><div id=result class=result></div><button class=copy onclick=copy()>Copy Hasil</button><textarea id=output rows=10></textarea></div><script>let data=[];function showTab(t){upload.style.display="none";manual.style.display="none";document.getElementById(t).style.display="block"}function loadCSV(){let f=csv.files[0];if(!f)return alert("Upload CSV dulu");let r=new FileReader;r.onload=e=>processData(e.target.result);r.readAsText(f)}function loadManual(){let t=manualCSV.value;if(!t)return alert("Paste data dulu");processData(t)}function processData(t){let r=t.split(/\r?\n/),p=preview;p.innerHTML="",data=[],r.forEach((r,i)=>{if(!r.trim())return;let c;r.includes("\t")?c=r.split("\t"):r.includes(";")?c=r.split(";"):r.includes(",")?c=r.split(","):c=r.split(/\s{2,}|\t/),c=c.map(v=>v.replace(/"/g,"").trim());let tr=document.createElement("tr");c.forEach(col=>{let td=document.createElement(i?"td":"th");td.innerText=col,tr.appendChild(td)}),p.appendChild(tr),0!==i&&(c.length>=7?data.push({date:c[1],type:c[2],user:c[3],coin:c[5]}):c.length>=6&&data.push({date:c[0],type:c[1],user:c[2],coin:c[4]}))})}function filter(){let u=users.value.toLowerCase().split("\n").map(v=>v.trim()).filter(v=>v),r={};u.forEach(u=>{r[u]={date:getToday(),total:0,list:[]}}),data.forEach(d=>{if(d.type&&d.type.toLowerCase().includes("deposit")){let u=d.user.toLowerCase();if(r[u]){let c=parseInt(d.coin.replace(/[^\d]/g,""))||0,a=d.date.split(" ")[0];r[u].date=a,r[u].total+=c,r[u].list.push(c.toLocaleString())}}});let o="";u.forEach(u=>{let d=r[u];o+=0==d.list.length?`${d.date} | ${u} | 0 | Total : 0\n`:`${d.date} | ${u} | ${d.list.join(" | ")} | Total : ${d.total.toLocaleString()}\n`}),output.value=o,result.innerHTML=o.replace(/\n/g,"<br>")}function getToday(){let d=new Date;return("0"+d.getDate()).slice(-2)+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear()}function copy(){output.select(),document.execCommand("copy"),alert("Berhasil di copy")}</script></body></html>
