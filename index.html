<!doctype html>

<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JANCUKS DCS TOOLKN</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Courier+Prime&display=swap" rel="stylesheet">

<style>

:root {
--bg: #000;
--fg: #fff;
--accent: #fff;
--glitch-red: #f00;
--glitch-blue: #0ff;
}

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:var(--bg);
color:var(--fg);
font-family:'VT323', monospace;
padding:20px;
}

/* WELCOME SCREEN */

#welcome{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.welcome-box{
text-align:center;
animation:fadeIn 1.5s ease;
}

.welcome-title{
font-family:'Press Start 2P', cursive;
font-size:2rem;
letter-spacing:3px;
margin-bottom:20px;
animation:glow 1.5s infinite alternate;
}

.welcome-sub{
margin-bottom:30px;
font-size:18px;
letter-spacing:3px;
}

.enter-btn{
padding:15px 30px;
background:#000;
border:1px solid #fff;
color:#fff;
cursor:pointer;
font-family:'Press Start 2P', cursive;
}

.enter-btn:hover{
background:#111;
}

@keyframes glow{
from{ text-shadow:0 0 5px #fff }
to{ text-shadow:0 0 20px #fff }
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

/* Glitch Title */

.title{
font-size:3rem;
text-align:center;
letter-spacing:5px;
color:var(--fg);
font-family:'Press Start 2P', cursive;
position:relative;
animation:glitchText 2s infinite;
}

.title::before,
.title::after{
content:'JANCUKS DCS TOOLKN';
position:absolute;
left:0;
top:0;
width:100%;
}

.title::before{
left:2px;
text-shadow:-2px 0 var(--glitch-red);
clip:rect(0,900px,30px,0);
animation:glitchTop 2s infinite;
}

.title::after{
left:-2px;
text-shadow:-2px 0 var(--glitch-blue);
clip:rect(35px,900px,70px,0);
animation:glitchBottom 2.5s infinite;
}

@keyframes glitchText{
0%,100%{transform:none}
20%{transform:skew(-1deg)}
40%{transform:skew(1deg)}
60%{transform:translate(-1px,-1px)}
80%{transform:translate(1px,1px)}
}

@keyframes glitchTop{
0%,100%{clip:rect(0,900px,30px,0)}
50%{clip:rect(10px,900px,40px,0)}
}

@keyframes glitchBottom{
0%,100%{clip:rect(35px,900px,70px,0)}
50%{clip:rect(45px,900px,70px,0)}
}

.container{
background:#111;
padding:20px;
border:1px solid #fff;
margin-top:20px;
}

.menu{
display:flex;
gap:10px;
margin-bottom:15px;
}

textarea,
input[type=file]{
width:100%;
background:#000;
border:1px solid #fff;
color:#fff;
padding:10px;
font-family:'Courier Prime', monospace;
}

button{
padding:10px 20px;
background:#000;
border:1px solid #fff;
color:#fff;
cursor:pointer;
font-family:'Press Start 2P', cursive;
}

button:hover{
background:#111;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #333;
padding:5px;
font-size:12px;
text-align:center;
}

.preview{
max-height:250px;
overflow:auto;
}

.result{
margin-top:10px;
border:1px solid #fff;
padding:10px;
background:#000;
}

.copy{
margin-top:10px;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
}

.tab{
margin-top:10px
}

</style>

</head>

<body>

<!-- WELCOME SCREEN -->

<div id="welcome">

<div class="welcome-box">

<h1 class="welcome-title">JANCUKS DCS TOOLKN</h1>

<p class="welcome-sub">ULTRA PRO TOOLKN</p>

<button onclick="enterApp()" class="enter-btn">
ENTER SYSTEM
</button>

</div>

</div>

<div class="title">JANCUKS DCS TOOLKN</div>

<div class="container">

<div class="menu">
<button onclick='showTab("upload")'>UPLOAD CSV</button>
<button onclick='showTab("manual")'>MANUAL INPUT</button>
</div>

<div id="upload" class="tab">
<h3>UPLOAD CSV</h3>
<input type="file" id="csv">
<button onclick="loadCSV()">PROSES CSV</button>
</div>

<div id="manual" class="tab" style="display:none">
<h3>MANUAL CSV</h3>
<textarea id="manualCSV" rows="8"></textarea>
<button onclick="loadManual()">PROSES MANUAL</button>
</div>

<div class="preview">
<table id="preview"></table>
</div>

<h4>PASTE USER ID</h4>

<textarea id="users" rows="6"></textarea>

<button onclick="filter()">FILTER USER</button>

<div id="result" class="result"></div>

<button class="copy" onclick="copy()">COPY HASIL</button>

<textarea id="output" rows="10"></textarea>

</div>

<script>

function enterApp(){

var w = document.getElementById("welcome");
w.style.opacity="0";

setTimeout(function(){
w.style.display="none";
},400);

}

let data=[];

function showTab(t){
upload.style.display="none";
manual.style.display="none";
document.getElementById(t).style.display="block"
}

function loadCSV(){
let f=csv.files[0];
if(!f)return alert("Upload CSV dulu");
let r=new FileReader;
r.onload=e=>processData(e.target.result);
r.readAsText(f)
}

function loadManual(){
let t=manualCSV.value;
if(!t)return alert("Paste data dulu");
processData(t)
}

function processData(t){

let r=t.split(/\r?\n/);
let p=preview;
p.innerHTML="";
data=[];

r.forEach((r,i)=>{

if(!r.trim())return;

let c;

r.includes("\t")?c=r.split("\t"):
r.includes(";")?c=r.split(";"):
r.includes(",")?c=r.split(","):
c=r.split(/\s{2,}|\t/)

c=c.map(v=>v.replace(/"/g,"").trim());

let tr=document.createElement("tr");

c.forEach(col=>{
let td=document.createElement(i?"td":"th");
td.innerText=col;
tr.appendChild(td)
});

p.appendChild(tr)

if(i!==0){

if(c.length>=7){

data.push({
date:c[1],
type:c[2],
user:c[3],
coin:c[5]
})

}else if(c.length>=6){

data.push({
date:c[0],
type:c[1],
user:c[2],
coin:c[4]
})

}

}

})

}

function filter(){

let u=users.value
.toLowerCase()
.split("\n")
.map(v=>v.trim())
.filter(v=>v);

let r={};

u.forEach(u=>{
r[u]={date:getToday(),total:0,list:[]}
});

data.forEach(d=>{

if(d.type && d.type.toLowerCase().includes("deposit")){

let u=d.user.toLowerCase();

if(r[u]){

let c=parseInt(d.coin.replace(/[^\d]/g,""))||0;
let a=d.date.split(" ")[0];

r[u].date=a;
r[u].total+=c;
r[u].list.push(c.toLocaleString())

}

}

});

let o="";

u.forEach(u=>{

let d=r[u];

if(d.list.length==0){

o+=`${d.date} | ${u} | 0 | Total : 0\n`

}else{

o+=`${d.date} | ${u} | ${d.list.join(" | ")} | Total : ${d.total.toLocaleString()}\n`

}

});

output.value=o;
result.innerHTML=o.replace(/\n/g,"<br>")

}

function getToday(){
let d=new Date;
return ("0"+d.getDate()).slice(-2)+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear()
}

function copy(){
output.select();
document.execCommand("copy");
alert("Berhasil di copy")
}

</script>

<!-- ULTRA PRO V2 PROTECTION -->

<script>

// Klik kanan = Access Denied
document.addEventListener("contextmenu", function(e){
e.preventDefault();
document.body.innerHTML="ACCESS DENIED";
document.body.style.background="#000";
document.body.style.color="#fff";
document.body.style.fontSize="40px";
document.body.style.textAlign="center";
document.body.style.paddingTop="20%";
});

// Ctrl+U = Access Denied
document.addEventListener("keydown", function(e){

if(e.ctrlKey && e.keyCode == 85){

e.preventDefault();

document.body.innerHTML="ACCESS DENIED";
document.body.style.background="#000";
document.body.style.color="#fff";
document.body.style.fontSize="40px";
document.body.style.textAlign="center";
document.body.style.paddingTop="20%";

}

});

</script>

</body>
</html>
